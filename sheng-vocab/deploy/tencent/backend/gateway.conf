server {
 listen 8000;
 client_max_body_size 3m;
 location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location /rest/v1/ { proxy_pass http://rest:3000/; }
 location /functions/v1/ { proxy_pass http://functions:9000/; proxy_read_timeout 65s; }
 location / { return 404; }
}
