<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盛老师词汇训练</title><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}body{min-height:100vh;background:#f2f6fc}main{width:min(92%,600px);margin:5vh auto 110px;background:white;border-radius:24px;padding:clamp(20px,5vw,40px);box-shadow:0 12px 45px #263d6414}header{display:flex;align-items:center;gap:12px;color:#213e69;font-weight:700}header b{background:#205bb1;color:white;border-radius:12px;padding:9px 14px;font-size:24px}h1,h2,h3{margin:22px 0 12px}label{display:block;margin:14px 0}input,textarea,select{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #ccd8ea}button{border-radius:10px;padding:10px;margin:4px}#nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));box-shadow:0 -2px 12px #15325212}#nav button{background:transparent}#nav [aria-current=true]{background:#e7effc;color:#174f9a}article,details{padding:14px;background:#f4f7fc;border-radius:12px;margin:12px 0}#msg{color:#78451e}</style><main><header><b aria-hidden="true">S</b>盛老师词汇训练</header><h1 id="welcome">欢迎同学</h1><p id="msg" role="status"></p><form id="login"><label>账号<input placeholder="学生输入姓名拼音，老师输入邮箱" class="input" name="email" type="text" required autocomplete="username"></label><label>密码<input class="input" name="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form><form id="change" hidden><h2>首次登录，设置新密码</h2><label>新密码<input name="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="至少 10 位"></label><label>确认新密码<input name="confirm" type="password" required autocomplete="new-password"></label><button class="primary">保存并进入班级</button><button type="button" id="switch">换个账号</button></form><section id="room" hidden><button id="logout">退出登录</button><h2 id="person"></h2><form id="publish" hidden><label>任务名称<input name="title" class="input" required maxlength="80"></label><label>每行一个单词，用制表符分隔单词和释义<textarea name="words" required rows="6" class="input"></textarea></label><button class="primary">发布任务</button></form><form id="enroll" hidden><h2>添加学生</h2><label>学号（小写字母、数字、下划线或短横线）<input class="input" name="number" pattern="[a-z0-9_\\-]{1,24}" required></label><label>学生昵称<input class="input" name="name" maxlength="30" required></label><label>初始密码（至少10位）<input class="input" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required></label><button class="primary">创建学生账号</button></form><div id="taskpanel"><h2>班级任务</h2><div id="tasks"></div></div><div id="extra"></div><nav id="nav" hidden aria-label="主导航"></nav></section></main><script type="module" src="./class-ui.mjs"></script></html>
