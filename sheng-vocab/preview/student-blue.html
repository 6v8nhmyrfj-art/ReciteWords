<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>盛老师词汇训练 · 学生端设计稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fc;color:#193859;font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #73adf4}header,main,nav{max-width:620px;margin:auto}header{display:flex;align-items:center;gap:9px;padding:16px 18px 8px}header b{display:grid;place-items:center;background:#2168c4;color:white;border-radius:10px;width:31px;height:31px;font:italic bold 23px Georgia}header strong{font-size:14px}header small{margin-left:auto;color:#506b8b}main{padding:5px 16px calc(87px + env(safe-area-inset-bottom));min-height:70dvh}h1{font-size:clamp(23px,6vw,31px);margin:10px 0 14px;letter-spacing:-.04em}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}p{margin:7px 0;color:#526e8a}section,.row,.metric{background:#fff;border:1px solid #d7e5f4;border-radius:17px;padding:16px;margin:10px 0}.hero{position:relative;overflow:hidden;background:#1d539e;color:white;border:0;padding:20px}.hero:after{content:'Aa';position:absolute;right:-4px;top:-38px;transform:rotate(-12deg);font:italic 124px Georgia;color:#ffffff10;pointer-events:none}.hero small,.hero p{color:#d7e7fc}.hero h2{font-size:24px}.bar{display:block;height:6px;background:#ffffff35;border-radius:4px;margin:14px 0 6px}.bar i{display:block;width:60%;height:100%;background:#a7d8ff;border-radius:4px}.action,.soft,.primary{border:0;border-radius:10px;padding:10px 16px;font-weight:650;min-height:42px}.action{background:white;color:#194d94;margin-top:12px}.soft{background:#eaf3ff;color:#225b9e}.primary{background:#2064b8;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{padding:10px 6px;text-align:center;margin:0}.metric b{display:block;font-size:22px}.metric small,small{font-size:12px}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.row span{flex:1}.row em{font:italic bold 21px Georgia;color:#2768aa;background:#e8f3ff;padding:7px;border-radius:9px}.row small{display:block;color:#587391}.heading{margin:18px 0 4px}.card{text-align:center;padding:30px 14px}.word{font:600 clamp(28px,9vw,45px) Georgia;color:#204a79;margin:15px 0}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #d8e6f2;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:2}nav button{background:none;border:0;border-radius:10px;padding:4px 0;color:#596f89;font-size:12px}nav button.on{background:#e8f2ff;color:#155eb1;font-weight:700}svg{width:19px;height:19px;display:block;margin:0 auto 2px}input{display:block;width:100%;padding:11px 12px;border-radius:10px;border:1px solid #b9cee3;margin:4px 0 12px;font-size:16px}.hint{font-size:12px}.back{border:0;background:none;color:#2868ad;padding:8px 0}.login{padding:20px}.login button{width:100%}@media(min-width:800px){body{padding-top:2vh}main{padding-inline:20px}nav{border-radius:16px 16px 0 0}}@media(max-height:650px){header{padding-top:6px}.hero,.card{padding:13px}h1{margin:5px 0}.heading{margin-top:10px}}
</style><header><b>S</b><strong>盛老师词汇训练</strong><small>学生端 · 设计预览</small></header><main id="app"></main><nav id="nav"></nav><script>
const tabs=['班级任务','自主学习','测单词','我的'],paths=['M4 4h16v16H4z M8 9h8 M8 14h5','M12 6Q7 3 3 5v13q5-2 9 1 4-3 9-1V5q-5-2-9 1v13','M4 17l1-5L16 2l5 5-11 11z M4 21h16','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M4 21c0-10 16-10 16 0'];
const books=[{name:'校园生活',en:'School Life',words:[['library','图书馆'],['classroom','教室'],['subject','科目'],['homework','家庭作业'],['teacher','老师']]},{name:'旅行与交通',en:'On the Road',words:[['journey','旅行'],['station','车站'],['ticket','车票']]}];
let page=0,book=0,pos=0,learned=3,score=0,mode='',show=false;
const el=id=>document.getElementById(id),btn=(s,a,c='soft')=>'<button class="'+c+'" onclick="'+a+'">'+s+'</button>',row=(s,d,a,icon)=>'<button class="row" onclick="'+a+'"><em>'+icon+'</em><span><strong>'+s+'</strong><small>'+d+'</small></span>›</button>';
function menu(i){page=i;el('nav').hidden=false;el('nav').style.display='grid';el('nav').innerHTML=tabs.map((s,k)=>btn('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="'+paths[k]+'"/></svg>'+s,'home('+k+')',i===k?'on':'')).join('');window.scrollTo(0,0)}
function home(i){menu(i);const a=el('app');if(!i)a.innerHTML='<h1>班级任务</h1><section class="hero"><small>七年级 · 今日任务</small><h2>校园生活</h2><p>Unit 1　School Life</p><span class="bar"><i style="width:'+learned*20+'%"></i></span><small>已学 '+learned+' / 5 词'+(learned===5?' · 已打卡':'')+'</small><br>'+btn(learned===5?'再复习一遍':'继续学习　→',"start(0,'task')",'action')+'</section><h3 class="heading">我的学习</h3><div class="grid"><div class="metric"><b>'+learned+'</b><small>今日已学</small></div><div class="metric"><b>3 天</b><small>本周打卡</small></div><div class="metric"><b>80%</b><small>本周正确率</small></div></div>'+row('任务词汇自测','校园生活 · 5 个单词',"start(0,'quiz')",'Aa');
else if(i===1||i===2)a.innerHTML='<h1>'+tabs[i]+'</h1><p>'+(i===1?'选一本书，按自己的节奏复习。':'看中文写英文，答完即可查看结果。')+'</p>'+books.map((b,k)=>row(b.name,b.en+' · '+b.words.length+' 词',"start("+k+",'"+(i===1?'self':'quiz')+"')",k?'J':'S')).join('');
else a.innerHTML='<h1>我的</h1><section><h2>示例同学</h2><p>七年级</p></section>'+row('学习记录','查看最近一次学习和测验',"historyView()",'↗')+row('预览首次登录','查看账号登录与首次改密流程','auth(false)','S')}
function start(k,m){book=k;mode=m;pos=m==='task'&&learned<5?learned:0;score=0;show=false;draw()}
function historyView(){el('app').innerHTML=btn('‹ 我的','home(3)','back')+'<h1>学习记录</h1><section>校园生活 · 已学 '+learned+' / 5 词</section>'}
function draw(){const b=books[book],w=b.words[pos],a=el('app');if(!w){a.innerHTML='<h1>'+(mode==='quiz'?'测验完成':'本轮完成')+'</h1><section class="card"><h2>'+b.name+'</h2><p>'+(mode==='quiz'?'答对 '+score+' / '+b.words.length+' 题':mode==='task'?'今日任务已打卡':'已学完本组词卡')+'</p>'+btn('返回'+tabs[page],'home(page)','primary')+'</section>';return}
a.innerHTML=btn('‹ '+tabs[page],'home(page)','back')+'<h1>'+b.name+'</h1><section class="card"><small>'+(mode==='quiz'?'拼写测验':'学习卡片')+'　'+(pos+1)+' / '+b.words.length+'</small><div class="word">'+(mode==='quiz'?w[1]:w[0])+'</div><div id="panel"></div></section>';const p=el('panel');if(mode==='quiz'){p.innerHTML='<form onsubmit="answer(event)"><input id="ans" required placeholder="输入英文单词" autocomplete="off"><button class="primary">核对答案</button></form>';return}p.innerHTML=show?'<p>'+w[1]+'</p>'+btn(mode==='task'?'记为已学　→':'下一词　→','next()','primary'):btn('查看释义','show=true;draw()')}
function next(){pos++;if(mode==='task')learned=Math.max(learned,pos);show=false;draw()}
function answer(e){e.preventDefault();const w=books[book].words[pos],ok=el('ans').value.trim().toLowerCase()===w[0];if(ok)score++;el('panel').innerHTML='<p>'+(ok?'答对了':'正确拼写：'+w[0])+'</p>'+btn('下一题','next()','primary')}
function auth(change){el('nav').style.display='none';el('app').innerHTML='<h1>'+(change?'设置新密码':'欢迎同学')+'</h1><section class="login"><form id="demoform"><label>'+(change?'新密码':'账号')+'<input required '+(change?'type="password" minlength="10"':'placeholder="姓名拼音"')+'></label><label>'+(change?'确认新密码':'密码')+'<input required type="password"></label><button class="primary">'+(change?'保存并进入班级':'登录')+'</button></form><p class="hint">原型演示，请使用虚构账号和密码。</p></section>'+btn('返回预览','home(3)','back');el('demoform').onsubmit=e=>{e.preventDefault();if(change&&e.target.elements[0].value!==e.target.elements[1].value)return alert('两次输入不一致');change?home(0):auth(true)}}
home(0)
</script></html>
