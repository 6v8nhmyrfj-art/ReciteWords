const tabs=['教学概览','班级与学生','我的词库','单词书','任务管理'],classes=['七年级','八年级第一班','八年级第二班','九年级强化班'],sizes=[12,8,8,12],done=[9,6,7,8],libs=['校园生活','旅行与交通','常用动词'],books=['七年级 · 同步词汇','中考 · 高频动词'],words=[['discover','发现'],['library','图书馆'],['subject','科目']],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let group=0,tab=0,units=libs.map(()=>words),assign=[],chapters=[[0,1],[2]];

function student(k){v.innerHTML=btn('‹ '+classes[group],'cls(group)')+heading(['学生甲','学生乙','学生丙'][k])+stats([['本周平均成绩',[92,88,80][k]+' 分','已完成测验的平均分'],['累计已学',[24,18,12][k]+' 词','同一单词只计一次'],['最近一次',[90,85,76][k]+' 分','词义与拼写']])+'<article><h2>逐词表现</h2><p>discover　作答 5 次 · 正确 2 次</p><p>library　作答 4 次 · 正确 4 次</p></article>'}
function term(i){v.innerHTML=btn('‹ 教学概览','go(0)')+heading(['discover','although','instead'][i])+'<article><h2>各班作答正确率</h2>'+classes.map((s,k)=>line(s+'　'+[55,60,48,45][k]+'%','cls('+k+')')).join('')+'</article>'}
function lib(k){go(2);v.innerHTML=btn('‹ 我的词库','go(2)')+heading(esc(libs[k]))+'<section>'+units[k].map(w=>'<p><b>'+esc(w[0])+'</b>　'+esc(w[1])+'</p>').join('')+'</section>'+btn('用此词库布置任务','task('+k+')')}
function newlib(){v.innerHTML=heading('新建词库')+'<form onsubmit="save(event)"><label>词库名 <input id=title1 required></label><label>单词和释义，每行一组<textarea required id=ws placeholder="discover 发现"></textarea></label><button>保存词库</button></form>'}function save(e){e.preventDefault();let rows=ws.value.trim().split(/\n/).map(x=>x.trim().split(/\s+(.+)/));if(rows.some(r=>!r[1]))return alert('每行请填写单词和释义');libs.push(title1.value.trim());units.push(rows);lib(libs.length-1)}

function task(k=0){go(4);v.innerHTML=heading('布置任务')+'<form onsubmit="event.preventDefault();assign.push(c.value+\' · \'+l.value);go(4)"><label>布置给 <select id=c>'+classes.map(s=>'<option>'+s+'</option>').join('')+'</select></label><label>选择词库 <select id=l>'+libs.map((s,i)=>'<option '+(i===k?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label><button class=accent>预览发布</button></form>'}if('scrollRestoration' in history)history.scrollRestoration='manual';go(0)
