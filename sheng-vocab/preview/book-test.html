<!doctype html><html lang="zh-CN"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>词书掌握度测评</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#193854;font:15px/1.45 -apple-system,"PingFang SC",sans-serif}main{max-width:480px;margin:auto;padding:16px 14px calc(86px + env(safe-area-inset-bottom))}header,.line,.top,nav{display:flex;align-items:center;justify-content:space-between;gap:8px}header i{background:#2164bb;color:white;border-radius:10px;font:bold italic 22px Georgia;padding:5px 11px}header strong{margin-right:auto}small,p{color:#536b85}h1{font-size:25px;margin:18px 0 4px}h2{font-size:17px;margin:0}p{margin:4px 0}section{background:white;border:1px solid #d6e4f4;border-radius:16px;padding:14px;margin:11px 0}.hero{background:#174e90;color:white}.hero small{color:#d5e6fa}.hero b{font-size:32px}.hero .switch{background:#10437f;border-radius:9px;padding:2px;display:flex}.switch button{color:#e2efff;background:none;font-size:12px;padding:5px 8px}.switch .on{color:#174e90;background:white}.spark{width:100%;height:77px;display:block}.note{display:flex;justify-content:space-between;font-size:11px;color:#dcecff}button{font:inherit;border:0;border-radius:7px;background:#eef5ff;color:#235d9e;padding:7px;cursor:pointer}button:focus-visible{outline:3px solid #66a5f4}.line{width:100%;text-align:left;background:white;color:#1a3956;padding:11px 0;border-radius:0;border-bottom:1px solid #edf2f7}.line:last-child{border:0}.line small{display:block}.line em{font-style:normal;font-size:13px;color:#406684}.list{padding-top:4px;padding-bottom:4px}.more{font-size:12px}.logout{width:100%;padding:10px;background:white;border:1px solid #d6e4f4}.sub{font-size:12px}.tag{padding:3px 7px;border-radius:6px;background:#ebf4ff;color:#2f6297;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:white;border-top:1px solid #d6e4f4;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:3px}nav span{flex:1;text-align:center;font-size:11px;color:#58718b;padding:3px}nav b{display:block;font-size:17px}nav span:last-child{background:#eaf3ff;color:#175bb0;border-radius:8px}dialog{border:1px solid #c1d6eb;border-radius:16px;max-width:85vw}dialog::backdrop{background:#19385445}</style><style>progress{width:100%;accent-color:#2268bc;height:8px}input,textarea{display:block;width:100%;padding:12px;border:1px solid #c7d6e8;border-radius:9px;font:inherit;margin:12px 0}button{min-height:40px}.primary{background:#2164bb;color:white;padding:9px 18px}.word{font:600 32px Georgia;padding:20px 0}main{padding-bottom:35px}h3{margin-bottom:5px}</style><main><header><i>S</i><strong>盛老师词汇训练</strong><small>交互设计稿</small></header><div id="v"></div></main><script>
const words='book 书|water 水|school 学校|friend 朋友|family 家庭|teacher 老师|library 图书馆|travel 旅行|weather 天气|market 市场|borrow 借入|return 归还|prepare 准备|journey 旅程|subject 学科|discover 发现|protect 保护|improve 改善|environment 环境|responsibility 责任'.split('|').map(x=>x.split(' '));let i=0,answers=[],demo=false,rec=null;
function home(){v.innerHTML='<h1>测单词</h1><section class="hero"><small>词书掌握度测评</small><h2>初中核心词汇 · 示例书</h2><p style="color:white">20 个不同单词，最后用一句话检验运用。</p></section><section><h2>本轮安排</h2><p>阅读辨义 10 词 · 写作拼写 10 词</p><p>由常见词到进阶词，每一档都考阅读和写作。</p><button class="primary" onclick="start()">开始测评</button></section><button onclick="demo=true;sentence()">直接体验句子翻译与语音</button>'}
function start(){demo=false;i=0;answers=[];question()}
function question(){if(i===20){sentence();return}const w=words[i],read=i%2===0;v.innerHTML='<h1>词书掌握度测评</h1><section><div class="top"><strong>第 '+(i+1)+' / 20 词</strong><span class="tag">'+['基础','常见','进阶','挑战'][Math.floor(i/5)]+'</span></div><progress value="'+i+'" max="20"></progress><p>'+ (read?'阅读辨义 · 选中文释义':'写作词汇 · 拼出本书对应单词')+'</p><div class="word">'+w[read?0:1]+'</div><div id="area"></div></section><button onclick="mark(false)">不会，跳过此词</button>';if(read){for(const j of [i,(i+3)%20,(i+7)%20,(i+11)%20].sort(()=>Math.random()-.5)){let b=document.createElement('button');b.className='line';b.textContent=words[j][1];b.onclick=()=>mark(j===i);area.append(b)}}else{area.innerHTML='<form><input required autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="英文拼写" placeholder="输入英文拼写"><button class="primary">提交</button></form>';area.firstChild.onsubmit=e=>{e.preventDefault();mark(e.target.elements[0].value.trim().toLowerCase()===w[0])}}}
function mark(ok){answers.push(ok);i++;question()}
function sentence(){v.innerHTML='<h1>句子运用</h1><section><div class="top"><strong>最后一题 · 汉译英</strong><small>'+(demo?'单题预览':'词汇 20 / 20 已完成')+'</small></div><h3>保护环境是我们的责任。</h3><p>用英语说出或写出你的译文。</p><textarea rows="3" id="ans" aria-label="英文译文" placeholder="转写后可以修改，也可以直接输入"></textarea><button id="mic" onclick="voice()">🎙 说出英文</button> <button class="primary" onclick="judge()">确认译文</button><p id="tip" class="sub">语音由浏览器或系统识别，可能发送到其语音服务。设计稿只在本页显示转写。</p></section>'}
function voice(){if(rec){rec.stop();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){tip.textContent='此浏览器未提供语音识别。请点输入框使用键盘听写，或直接打字。';ans.focus();return}const r=new R();rec=r;r.lang='en-US';r.onresult=e=>{ans.value=(ans.value+' '+e.results[0][0].transcript).trim()};r.onerror=()=>{tip.textContent='未能识别，可重试或使用键盘听写。'};r.onend=()=>{rec=null;if(document.getElementById('mic'))mic.textContent='🎙 说出英文'};try{r.start();mic.textContent='停止录音'}catch{rec=null;tip.textContent='无法启动麦克风，请直接输入。'}}
function judge(){const t=ans.value.trim();if(!t){tip.textContent='先说出或写下译文。';return}if(rec){rec.onresult=null;rec.abort()}const normal=t.toLowerCase().replace(/[.,!?。]/g,'').replace(/\s+/g,' ').trim();const match=['it is our responsibility to protect the environment','protecting the environment is our responsibility','we are responsible for protecting the environment'].includes(normal);const count=k=>answers.filter((x,j)=>j%2===k&&x).length;v.innerHTML='<h1>'+(demo?'译文反馈':'本次抽测结果')+'</h1>'+(!demo?'<section><h2>初中核心词汇</h2><p>阅读辨义 '+count(0)+' / 10　·　写作拼写 '+count(1)+' / 10</p><p>需复习：'+(words.filter((_,j)=>!answers[j]).map(w=>w[0]).join('、')||'本轮全对')+'</p></section>':'')+'<section><h2>'+(match?'译文匹配参考表达':'待核对的译文')+'</h2><p id="mine"></p><p>参考：It is our responsibility to protect the environment.</p><small>核对要点：保护环境、我们的责任。其他合理表达可由老师确认。</small></section><button onclick="home()">返回测评首页</button>';mine.textContent='你的译文：'+t}
home()
</script></html>
