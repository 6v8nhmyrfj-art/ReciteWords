<!doctype html><html lang="zh-CN"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的 · 学习档案设计稿</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#193854;font:15px/1.45 -apple-system,"PingFang SC",sans-serif}main{max-width:480px;margin:auto;padding:16px 14px calc(86px + env(safe-area-inset-bottom))}header,.line,.top,nav{display:flex;align-items:center;justify-content:space-between;gap:8px}header i{background:#2164bb;color:white;border-radius:10px;font:bold italic 22px Georgia;padding:5px 11px}header strong{margin-right:auto}small,p{color:#536b85}h1{font-size:25px;margin:18px 0 4px}h2{font-size:17px;margin:0}p{margin:4px 0}section{background:white;border:1px solid #d6e4f4;border-radius:16px;padding:14px;margin:11px 0}.hero{background:#174e90;color:white}.hero small{color:#d5e6fa}.hero b{font-size:32px}.hero .switch{background:#10437f;border-radius:9px;padding:2px;display:flex}.switch button{color:#e2efff;background:none;font-size:12px;padding:5px 8px}.switch .on{color:#174e90;background:white}.spark{width:100%;height:77px;display:block}.note{display:flex;justify-content:space-between;font-size:11px;color:#dcecff}button{font:inherit;border:0;border-radius:7px;background:#eef5ff;color:#235d9e;padding:7px;cursor:pointer}button:focus-visible{outline:3px solid #66a5f4}.line{width:100%;text-align:left;background:white;color:#1a3956;padding:11px 0;border-radius:0;border-bottom:1px solid #edf2f7}.line:last-child{border:0}.line small{display:block}.line em{font-style:normal;font-size:13px;color:#406684}.list{padding-top:4px;padding-bottom:4px}.more{font-size:12px}.logout{width:100%;padding:10px;background:white;border:1px solid #d6e4f4}.sub{font-size:12px}.tag{padding:3px 7px;border-radius:6px;background:#ebf4ff;color:#2f6297;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:white;border-top:1px solid #d6e4f4;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:3px}nav span{flex:1;text-align:center;font-size:11px;color:#58718b;padding:3px}nav b{display:block;font-size:17px}nav span:last-child{background:#eaf3ff;color:#175bb0;border-radius:8px}dialog{border:1px solid #c1d6eb;border-radius:16px;max-width:85vw}dialog::backdrop{background:#19385445}</style><main><header><i>S</i><strong>盛老师词汇训练</strong><small>设计稿 · 示例数据</small></header><div id="view"></div></main><nav aria-label="导航位置示意"><span><b>⌂</b>班级任务</span><span><b>▤</b>自主学习</span><span><b>✎</b>测单词</span><span><b>●</b>我的</span></nav><dialog id="dlg"><h2>退出当前账号？</h2><p>学习记录已保存在账号下。</p><button onclick="dlg.close()">取消</button> <button onclick="dlg.close();detail('已退出（预览）','再次登录后，可继续查看学习记录。')">退出登录</button></dialog><script>
let period=7;const records=[['今天 17:42','班级任务','校园生活','完成 12 / 12 词，已打卡'],['今天 17:28','间隔复习','到期词复习','复习 8 词，其中 2 词需要再练'],['昨天 18:15','词汇测验','旅行与交通','答对 8 / 10 题，正确率 80%'],['11 月 3 日','班级任务','天气与季节','完成 10 / 10 词，已打卡']];
const btn=(s,fn)=>'<button class="more" onclick="'+fn+'">'+s+'</button>',line=(a,b,c,fn)=>'<button class="line" onclick="'+fn+'"><span><strong>'+a+'</strong><small>'+b+'</small></span><em>'+c+' ›</em></button>',back=()=>btn('‹ 返回我的','home()');
function detail(t,s){view.innerHTML=back()+'<h1>'+t+'</h1><section>'+s+'</section>';scrollTo(0,0)}
function item(i){let r=records[i];detail(r[2],'<span class="tag">'+r[1]+'</span><p>'+r[0]+'</p><b>'+r[3]+'</b>')}
function recordRow(r,i){return line(r[2],r[0]+' · '+r[1],r[3].split('，')[0],'item('+i+')')}
function historyList(filter='全部'){detail('最近学习记录',['全部','班级任务','间隔复习','词汇测验'].map(k=>btn(k,"historyList('"+k+"')")).join(' ')+'<p class="sub">当前：'+filter+'</p>'+records.map((r,i)=>filter==='全部'||filter===r[1]?recordRow(r,i):'').join(''))}
function tasks(){detail('已完成任务',records.map((r,i)=>r[1]==='班级任务'?recordRow(r,i):'').join(''))}
function trend(){let a=period===7?[110,113,113,118,122,124,128]:Array.from({length:30},(_,i)=>72+Math.floor(i/3)*5+Math.floor(i/8)*3+(i===29?2:0));let pts=a.map((v,i)=>[4+i*292/(a.length-1),65-(v-a[0])*50/(128-a[0])].join(',')).join(' ');return '<svg class="spark" role="img" aria-label="累计已学从 '+a[0]+' 增长至128词" viewBox="0 0 300 76" preserveAspectRatio="none"><path d="M4 65H296 M4 40H296 M4 15H296" stroke="#ffffff22"/><polygon points="4,73 '+pts+' 296,73" fill="#a0d3ff22"/><polyline points="'+pts+'" fill="none" stroke="#b9e4ff" stroke-width="3" stroke-linejoin="round"/><circle cx="296" cy="15" r="3" fill="white"/></svg><div class="note"><span>'+ (period===7?'10/30':'10/07')+' · '+a[0]+'词</span><span>11/05 · 128词</span></div>'}
function home(){view.innerHTML='<h1>我的</h1><p>小林同学　<span class="tag">七年级</span></p><section class="hero"><div class="top"><strong>我的词汇成长</strong><div class="switch">'+[7,30].map(x=>'<button class="'+(period===x?'on':'')+'" onclick="period='+x+';home()">'+x+' 天</button>').join('')+'</div></div><div><b>128</b> 词　<small>区间净增 '+(period===7?18:56)+' 词</small></div>'+trend()+'<small>累计已学 · 首次答对后计入，同词只算一次</small></section><section><div class="top"><h2>最近学习</h2>'+btn('全部记录 ›','historyList()')+'</div>'+records.slice(0,2).map(recordRow).join('')+'</section><section class="list">'+line('已完成任务','按任务查看完成时间和词数','2 项','tasks()')+line('复习清单','到期词和上次答错的词','8 词','review()')+'</section><button class="logout" onclick="dlg.showModal()">退出登录</button>'}
function review(){detail('复习清单','<h2>今天到期 · 8 词</h2><p class="sub">按复习计划到期时间排序</p>'+['discover · 发现','although · 虽然','library · 图书馆','subject · 学科','journey · 旅行','station · 车站','ticket · 票','central · 中心的'].map((w,i)=>'<p>'+w+(i<2?'　<span class="tag">上次答错</span>':'')+'</p>').join(''))}home()
</script></html>
